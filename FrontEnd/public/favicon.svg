<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <!-- Left angle bracket < -->
  <polyline points="13,9 6,16 13,23" fill="none" stroke="url(#code)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right angle bracket > -->
  <polyline points="19,9 26,16 19,23" fill="none" stroke="url(#code)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forward slash / -->
  <line x1="18" y1="7" x2="14" y2="25" stroke="url(#code)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>